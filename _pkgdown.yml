url: https://r-docs.synapse.org

template:
  bootstrap: 5

# Functional-interface topics for synapseclient.models classes are drafted
# as auto-man/<Class>_<Method>.Rd (see generateFunctionalInterfaceInfo in
# PythonPkgWrapperUtils.R) — one draft file per (class, method) pair, even
# though the real callable documented inside is the shared, unqualified
# name (e.g. "synGetAcl"). starts_with("<Class>_") groups a class's curated
# topics together here once they've been copied into man/.
reference:
- title: Agent
  desc: "Represents a [Synapse Agent Registration](https://rest-docs.synapse.org/rest/org/sagebionetworks/repo/model/agent/AgentRegistration.html)."
  contents:
  - Agent
  - has_keyword("Agent")
- title: AgentSession
  desc: "Represents a [Synapse Agent Session](https://rest-docs.synapse.org/rest/org/sagebionetworks/repo/model/agent/AgentSession.html)."
  contents:
  - AgentSession
  - has_keyword("AgentSession")
- title: AgentPrompt
  desc: "Represents a prompt, response, and metadata within an AgentSession."
  contents:
  - AgentPrompt
  - has_keyword("AgentPrompt")
