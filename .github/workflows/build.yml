
# build and test synapser.
#
# Deployment is done here: R-universe
# (https://sage-bionetworks.r-universe.dev/synapser) builds and serves each
# full GitHub release on its own.

name: build

on:
  push:
    # we build/test all pushed branches, but not tags.
    # we only push tags with releases, and we handle releases explicitly
    branches:
      - '**'
    tags-ignore:
      - '**'

  pull_request:

  release:
    types:
      - 'published'

permissions:
  contents: read

concurrency:
  # this is a workaround to avoid concurrent builds of the same branch/PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      # keep running the other cells when one fails, so one broken platform
      # doesn't cancel the rest and hide their results
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
        # R 4.1.x is excluded: it is the last Windows R with 32-bit (i386)
        # multiarch, and reticulate >= 1.44.0 (required for uv >= 0.8.0)
        # does not compile for i386 under Rtools40. See DESCRIPTION.
        r: [4.2.3, 4.3.1, 4.4.2, 4.5.3, 4.6.1]

    env:
      # Test coverage (required by rOpenSci / R-universe) is measured on a
      # single matrix cell, since the R code is the same on every platform.
      COVERAGE: ${{ matrix.os == 'ubuntu-22.04' && matrix.r == '4.6.1'}}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Python setup step is needed. synapser declares its Python
      # requirement via reticulate::py_require(), and reticulate provisions a
      # compatible Python itself. A Python on PATH sits below the managed
      # environment in reticulate's Order of Discovery, so one installed here
      # would not be used.

      - name: setup-r
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.r }}

      - name: shared-env
        id: shared-env
        shell: bash
        run: |
          PACKAGE_NAME=synapser
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

          PACKAGE_VERSION=$(grep "Version: " DESCRIPTION | awk '{print $2'})

          # if this was triggered by a release and the release tag
          # looks like semver then we use that for the package version.
          RELEASE_TAG=${{ github.event.release.tag_name }}
          if [[ $RELEASE_TAG =~ ^v?([[:digit:]\.]+)(-rc)? ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}.$GITHUB_RUN_NUMBER"

            # a release version overrides the package version
            # for purposes of creating artifacts
            PACKAGE_VERSION=$RELEASE_VERSION

            DATE=`date +%Y-%m-%d`
            # replace DESCRIPTION with $VERSION & $DATE
            # sed -i not portable on OSX so we wash through some temp files instead
            sed "s|^Version: .*$|Version: $PACKAGE_VERSION|g" DESCRIPTION > DESCRIPTION.temp
            sed "s|^Date: .*$|Date: $DATE|g" DESCRIPTION.temp > DESCRIPTION2.temp

            rm DESCRIPTION
            mv DESCRIPTION2.temp DESCRIPTION
            rm DESCRIPTION.temp
          fi

          echo "BRANCH_VERSION=$BRANCH_VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

          R_VERSION=${{matrix.r}}
          R_MAJOR_VERSION=$(echo $R_VERSION | cut -f1 -d".")
          R_MINOR_VERSION=$R_MAJOR_VERSION.$(echo $R_VERSION | cut -f2 -d".")
          echo "R_VERSION=$R_VERSION" >> $GITHUB_ENV
          echo "R_MAJOR_VERSION=$R_MAJOR_VERSION" >> $GITHUB_ENV
          echo "R_MINOR_VERSION=$R_MINOR_VERSION" >> $GITHUB_ENV

          # replace backslashes with forward slashes for windows.
          # windows bash will handle forward slashes fine and this
          # makes it easier to unify the path handling.
          R_LIBS_USER_SANITIZED=$(echo $R_LIBS_USER | sed 's/\\/\//g')
          echo "R_LIBS_USER=$R_LIBS_USER_SANITIZED" >> $GITHUB_ENV

      - name: setup-r-mac-15
        if: ${{matrix.os == 'macos-15'}}
        run: |
          R_LIBS_USER=${GITHUB_WORKSPACE}/R_LIBS
          rm -rf R_LIBS_USER
          mkdir -p $R_LIBS_USER
          echo "R_LIBS_USER=$R_LIBS_USER" >> $GITHUB_ENV

          echo "R=R" >> $GITHUB_ENV


      - name: install-test-config
        shell: bash
        run: |
          if [ -z "${{ secrets.encrypted_d17283647768_key }}" ]; then
            echo "No test configuration decryption keys available, skipping integration tests"
            exit 1
          fi

          # decrypt the encrypted test synapse configuration
          openssl aes-256-cbc -K ${{ secrets.encrypted_d17283647768_key }} -iv ${{ secrets.encrypted_d17283647768_iv }} -in test.synapseConfig.enc -out test.synapseConfig -d
          mv test.synapseConfig ~/.synapseConfig

      - name: install-pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          cache: true
          #drop stale dependency caches
          cache-version: 4
          extra-packages: ${{ env.COVERAGE == 'true' && 'any::covr, any::xml2' || '' }}

      # reticulate uses uv to build the Python environment. If uv is not
      # already installed, reticulate downloads its own copy. We install it
      # here instead so we control which version is used.
      #
      # The version is pinned on purpose. reticulate only works with the uv
      # versions it knows about
      - name: setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"

      - name: linux-build-package
        if: ${{runner.os == 'linux'}}
        run: |
          R CMD build ./
          R CMD INSTALL ./ --library=$R_LIBS_USER --no-test-load

      - name: mac-build-package
        if: ${{runner.os == 'macOS'}}
        run: |
          R CMD build ./
          R CMD INSTALL --build ${PACKAGE_NAME}_${PACKAGE_VERSION}.tar.gz --library=$R_LIBS_USER --no-test-load

      - name: windows-build-package
        if: ${{runner.os == 'Windows'}}
        shell: bash
        run: |
          R CMD build ./
          R CMD INSTALL --build ${PACKAGE_NAME}_${PACKAGE_VERSION}.tar.gz --library=$R_LIBS_USER --no-test-load --no-multiarch

      - name: run-tests
        shell: bash
        run: |
          echo ".libPaths(c('$R_LIBS_USER', .libPaths()));" > runTests.R
          echo "setwd(sprintf('%s/tests', getwd()));" >> runTests.R
          echo "source('testthat.R')" >> runTests.R
          echo "detach(\"package:synapser\", unload=TRUE);" >> runTests.R
          # Reload to check that .onLoad succeeds a second time in the same
          # session, where the embedded Python is already initialized.
          echo "library(synapser)" >> runTests.R
          R --vanilla < runTests.R
          rm runTests.R

      # covr installs an instrumented copy of the package and runs
      # tests/testthat.R, like run-tests, then writes a Cobertura report for
      # SonarQube Cloud's R analyzer (sonar.r.cobertura.reportPaths).
      - name: coverage
        if: ${{ env.COVERAGE == 'true' }}
        shell: bash
        run: |
          cat > coverage.R <<'EOF'
          .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths()))
          cov <- covr::package_coverage(type = 'tests', quiet = FALSE)
          print(cov)
          covr::to_cobertura(cov, filename = 'coverage.xml')
          EOF
          R --vanilla < coverage.R
          rm coverage.R
          # SonarQube Cloud's XML parser rejects the DOCTYPE line covr writes.
          sed -i '/^<!DOCTYPE/d' coverage.xml

      - name: upload-coverage-report
        if: ${{ env.COVERAGE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

  sonarcloud:
    needs: build
    name: SonarCloud
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: download-coverage-report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # R-universe deployment is handled in its monorepo (https://github.com/r-universe/sage-bionetworks)
  # This job only builds and checks; nothing is deployed. See https://github.com/r-universe-org/workflows
  r-universe:
    name: R-universe testing
    uses: r-universe-org/workflows/.github/workflows/build.yml@v3
    with:
      # Take dependencies from the Sage-Bionetworks universe, as R-universe
      # does. Hardcoded rather than github.repository_owner so builds on
      # forks still resolve to the right universe.
      universe: sage-bionetworks
      # synapser needs CPython via reticulate, which webR cannot provide, so
      # the WebAssembly build can never succeed.
      skip: wasm
