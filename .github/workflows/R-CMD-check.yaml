name: R-CMD-check

permissions:
  contents: read

concurrency:
  # this is a workaround to avoid concurrent builds of the same branch/PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


on:
  # Manually trigger the Action under Actions/R-CMD-check
  workflow_dispatch:
  # Run on pushes to the main branches, and on every pull request
  push:
    branches:
      - develop
      - master
    tags-ignore:
      - '**'
  pull_request:

  release:
    types:
      - 'published'

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'

      # error-on only fails on ERRORs, so this fails the job on any WARNING
      # whose check is not listed in the baseline file.
      - name: Fail on WARNINGs not in the baseline
        shell: bash
        run: |
          sed -nE 's/^\* (checking .*) \.\.\. (\[[^]]*\] )?WARNING$/\1/p' check/synapser.Rcheck/00check.log > "$RUNNER_TEMP/warnings.txt"
          if grep -vxFf .github/R-CMD-check-warning-baseline.txt "$RUNNER_TEMP/warnings.txt"; then
            echo "::error::The R CMD check WARNINGs listed above are not in .github/R-CMD-check-warning-baseline.txt"
            exit 1
          fi
